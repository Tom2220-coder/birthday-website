/* Silver letter theme */

;pointer-events:none}.falling-glitter i{position:absolute;left:calc((var(--i)*43)%100*1%);top:-20px;width:calc(2px + (var(--i)%4)*1px);height:calc(6px + (var(--i)%5)*2px);background:linear-gradient(#fff,#8e9095);box-shadow:0 0 8px #fff9;animation:glitterFall calc(4.5s + (var(--i)%7)*.7s) linear infinite;animation-delay:calc((var(--i)%11)*-.8s);opacity:.75}

/* Airy white theme */

.photo-gallery{position:absolute;inset:0;z-index:3;pointer-events:none}.photo-frame{position:absolute;width:150px;padding:10px 10px 28px;background:#fff;box-shadow:0 14px 35px #2e7fa52b;border:1px solid #d8edf7;opacity:0;animation:frameArrive .8s 1.25s ease forwards}.photo-empty{height:150px;display:grid;place-items:center;background:linear-gradient(145deg,#eaf8ff,#bce8fb);border:1px dashed #72bddf;color:#fff}.photo-empty span{font:36px Georgia;text-shadow:0 2px 12px #209bd2}.photo-frame p{margin:11px 0 -17px;font:italic 12px Georgia;color:#527b90}.photo-1{left:4vw;top:13%;transform:rotate(-9deg)}.photo-2{left:9vw;bottom:8%;transform:rotate(7deg)}.photo-3{right:5vw;top:10%;transform:rotate(8deg)}.photo-4{right:9vw;bottom:7%;transform:rotate(-7deg)}@keyframes frameArrive{from{opacity:0;translate:0 20px}to{opacity:.88;translate:0 0}}@media(max-width:950px){.photo-frame{width:105px;padding:7px 7px 22px}.photo-empty{height:100px}.photo-frame p{font-size:9px}.photo-1{left:-18px;top:8%}.photo-3{right:-18px;top:8%}.photo-2,.photo-4{display:none}}@media(max-width:600px){.photo-frame{width:84px}.photo-empty{height:78px}.photo-frame p{display:none}.photo-1{left:-20px;top:14%}.photo-3{right:-20px;top:14%}}

/* Eight animated memory frames */
.photo-frame{--rot:0deg;opacity:0;animation:frameReveal .65s 1.05s ease both,frameFloat 3.2s 1.7s ease-in-out infinite alternate;transform:rotate(var(--rot));will-change:transform}.photo-frame:nth-child(2n){animation-duration:.7s,3.8s}.photo-frame:nth-child(3n){animation-delay:1.25s,1.95s}.photo-empty{position:relative;overflow:hidden;background:linear-gradient(135deg,#f5fcff,#b9e7fa,#e9f8ff);background-size:220% 220%;animation:photoGlow 5s ease-in-out infinite}.photo-empty:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,#ffffffc7 50%,transparent 60%);transform:translateX(-70%);animation:photoShine 4.2s ease-in-out infinite}.photo-1{left:2vw;top:8%;--rot:-10deg}.photo-2{left:8vw;bottom:5%;--rot:7deg}.photo-3{right:3vw;top:7%;--rot:9deg}.photo-4{right:8vw;bottom:5%;--rot:-8deg}.photo-5{left:18vw;top:-42px;--rot:5deg}.photo-6{right:19vw;top:-48px;--rot:-6deg}.photo-7{left:25vw;bottom:-95px;--rot:-4deg}.photo-8{right:24vw;bottom:-92px;--rot:6deg}@keyframes frameReveal{from{opacity:0;transform:rotate(var(--rot)) scale(.72) translateY(30px)}to{opacity:.9;transform:rotate(var(--rot)) scale(1) translateY(0)}}@keyframes frameFloat{from{transform:rotate(var(--rot)) translateY(-5px)}to{transform:rotate(var(--rot)) translateY(8px)}}@keyframes photoGlow{50%{background-position:100% 100%}}@keyframes photoShine{0%,60%{transform:translateX(-75%)}85%,100%{transform:translateX(75%)}}
@media(max-width:1100px){.photo-5,.photo-6,.photo-7,.photo-8{display:none}}@media(max-width:950px){.photo-2,.photo-4{display:block;bottom:-35px}.photo-1{left:-18px;top:8%}.photo-3{right:-18px;top:8%}}@media(max-width:600px){.photo-2,.photo-4{display:none}}

/* Eight equal frames balanced on both sides of the cake */
.photo-frame{width:128px;height:146px;padding:8px;background:#fff}.photo-empty{width:100%;height:100%}.photo-frame p{display:none}.photo-1{left:2vw;top:5%;--rot:-8deg}.photo-2{left:12vw;top:28%;bottom:auto;--rot:6deg}.photo-3{left:2vw;top:auto;bottom:27%;right:auto;--rot:7deg}.photo-4{left:12vw;right:auto;top:auto;bottom:4%;--rot:-6deg}.photo-5{display:block;right:2vw;left:auto;top:5%;bottom:auto;--rot:8deg}.photo-6{display:block;right:12vw;left:auto;top:28%;bottom:auto;--rot:-6deg}.photo-7{display:block;right:2vw;left:auto;top:auto;bottom:27%;--rot:-7deg}.photo-8{display:block;right:12vw;left:auto;top:auto;bottom:4%;--rot:6deg}
@media(max-width:1100px){.photo-frame,.photo-1,.photo-2,.photo-3,.photo-4,.photo-5,.photo-6,.photo-7,.photo-8{display:block;width:88px;height:104px;padding:5px;bottom:auto}.photo-1,.photo-2,.photo-3,.photo-4{left:8px;right:auto}.photo-5,.photo-6,.photo-7,.photo-8{right:8px;left:auto}.photo-1,.photo-5{top:5%}.photo-2,.photo-6{top:28%}.photo-3,.photo-7{top:51%}.photo-4,.photo-8{top:74%}.photo-empty{height:100%}}
@media(max-width:600px){.photo-frame,.photo-1,.photo-2,.photo-3,.photo-4,.photo-5,.photo-6,.photo-7,.photo-8{display:block;width:58px;height:70px;padding:3px}.photo-1,.photo-2,.photo-3,.photo-4{left:-8px}.photo-5,.photo-6,.photo-7,.photo-8{right:-8px}.photo-1,.photo-5{top:8%}.photo-2,.photo-6{top:31%}.photo-3,.photo-7{top:54%}.photo-4,.photo-8{top:77%}.photo-empty span{font-size:22px}}

/* Reveal the memories only after the candle is blown out */
.photo-gallery:not(.photos-visible) .photo-frame{opacity:0;animation:none!important}.photo-1,.photo-2,.photo-3,.photo-4{--from-x:-70px}.photo-5,.photo-6,.photo-7,.photo-8{--from-x:70px}.photos-visible .photo-frame{animation:photoMemoryReveal .85s .2s cubic-bezier(.18,.8,.2,1) both,frameFloat 3.4s 1.3s ease-in-out infinite alternate}.photos-visible .photo-1,.photos-visible .photo-5{animation-delay:.18s,1.25s}.photos-visible .photo-2,.photos-visible .photo-6{animation-delay:.4s,1.47s}.photos-visible .photo-3,.photos-visible .photo-7{animation-delay:.62s,1.69s}.photos-visible .photo-4,.photos-visible .photo-8{animation-delay:.84s,1.91s}.cake.out{animation:cakeWishGlow .9s ease-out}.cake.out~*{transition:.4s}@keyframes photoMemoryReveal{0%{opacity:0;transform:rotate(var(--rot)) translateX(var(--from-x)) scale(.62);filter:blur(5px)}60%{opacity:1;filter:blur(0)}100%{opacity:.92;transform:rotate(var(--rot)) translateX(0) scale(1);filter:blur(0)}}@keyframes cakeWishGlow{0%{filter:drop-shadow(0 22px 18px #3c8fb62e)}45%{filter:drop-shadow(0 0 38px #fff) drop-shadow(0 0 55px #49b9ed)}100%{filter:drop-shadow(0 22px 18px #3c8fb62e)}}

/* Larger candle button */
.wish-button{min-width:180px;padding:17px 34px;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:.08em;box-shadow:0 12px 28px #3a9fc83d;transition:transform .2s,box-shadow .2s}.wish-button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 17px 34px #278dbb4f}.wish-button:active{transform:scale(.96)}

/* Vietnamese-safe typography: keep accents attached and spacing natural. */
.birthday-card .wish{
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  font-style:normal;
  font-weight:500;
  letter-spacing:0;
  word-spacing:0;
  font-kerning:normal;
  text-rendering:optimizeLegibility;
}

/* Playful cake entrance and an always-alive candle. */
.birthday-card.visible .tier-bottom{animation:cakeTierIn .75s .12s cubic-bezier(.2,.9,.25,1.25) both}
.birthday-card.visible .tier-middle{animation:cakeTierIn .75s .3s cubic-bezier(.2,.9,.25,1.25) both}
.birthday-card.visible .tier-top{animation:cakeTierIn .75s .48s cubic-bezier(.2,.9,.25,1.25) both}
.birthday-card.visible .cake-wrap .plate{animation:plateSlideIn .7s ease-out both}
.birthday-card.visible .cake-tier i{animation:sprinklePop .45s .95s cubic-bezier(.2,.9,.3,1.5) both}
.birthday-card.visible .cake-tier i:nth-child(2n){animation-delay:1.08s}
.birthday-card.visible .cake-tier i:nth-child(3n){animation-delay:1.2s}
.cake-wrap:not(.out){animation:cakeBreath 3s 1.4s ease-in-out infinite}
.cake-wrap:not(.out) .candle{transform-origin:50% 100%;animation:candleSway 1.8s 1.2s ease-in-out infinite}
.cake-wrap:not(.out) .flame{animation:flameDance .48s ease-in-out infinite alternate}
.cake-wrap.out{animation:cakeWishGlow .9s ease-out}

@keyframes cakeTierIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-55px) scale(.72)}
  65%{opacity:1;transform:translateX(-50%) translateY(7px) scale(1.04,.94)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
@keyframes plateSlideIn{
  from{opacity:0;transform:translateX(-50%) scaleX(.35)}
  to{opacity:1;transform:translateX(-50%) scaleX(1)}
}
@keyframes sprinklePop{
  from{opacity:0;transform:translateY(-18px) scale(0) rotate(-90deg)}
  to{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}
@keyframes cakeBreath{
  0%,100%{filter:drop-shadow(0 22px 18px #3c8fb62e)}
  50%{filter:drop-shadow(0 25px 22px #248fbd44) drop-shadow(0 0 10px #ffffffa8)}
}
@keyframes candleSway{
  0%,100%{transform:translateX(-50%) rotate(-1.5deg)}
  50%{transform:translateX(-50%) rotate(1.5deg)}
}
@keyframes flameDance{
  0%{transform:translateX(-50%) scale(.92,1.08) rotate(-5deg);filter:brightness(1)}
  100%{transform:translateX(-50%) scale(1.08,.88) rotate(6deg);filter:brightness(1.18)}
}

/* A more cinematic cake assembly when the letter opens. */
.birthday-card.visible .tier-bottom{animation:cakeRise .85s .18s cubic-bezier(.16,.9,.25,1.22) both}
.birthday-card.visible .tier-middle{animation:cakeSlideLeft .85s .48s cubic-bezier(.16,.9,.25,1.18) both}
.birthday-card.visible .tier-top{animation:cakeSlideRight .85s .76s cubic-bezier(.16,.9,.25,1.18) both}
.birthday-card.visible .candle{animation:candleJumpIn .65s 1.12s cubic-bezier(.18,.9,.25,1.35) both,candleSway 1.8s 1.8s ease-in-out infinite}
.birthday-card.visible .flame{animation:flameIgnite .55s 1.5s cubic-bezier(.2,.85,.3,1.35) both,flameDance .48s 2.05s ease-in-out infinite alternate}
.cake-magic{inset:0;left:0!important;transform:none!important;pointer-events:none;z-index:8}
.cake-magic i{position:absolute;left:50%;top:58%;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 18px #45b9eb;opacity:0}
.birthday-card.visible .cake-magic i{animation:cakeMagicBurst 1s calc(.7s + var(--p)*.018s) ease-out both;--a:calc(var(--p)*47deg);--d:calc(82px + (var(--p)%6)*15px)}

@keyframes cakeRise{0%{opacity:0;transform:translateX(-50%) translateY(100px) scale(.65)}65%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.04,.96)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes cakeSlideLeft{0%{opacity:0;transform:translateX(-160%) rotate(-9deg) scale(.72)}70%{opacity:1;transform:translateX(-45%) rotate(2deg) scale(1.03)}100%{opacity:1;transform:translateX(-50%) rotate(0) scale(1)}}
@keyframes cakeSlideRight{0%{opacity:0;transform:translateX(65%) rotate(9deg) scale(.72)}70%{opacity:1;transform:translateX(-55%) rotate(-2deg) scale(1.03)}100%{opacity:1;transform:translateX(-50%) rotate(0) scale(1)}}
@keyframes candleJumpIn{0%{opacity:0;transform:translateX(-50%) translateY(45px) scaleY(.2)}70%{opacity:1;transform:translateX(-50%) translateY(-7px) scaleY(1.08)}100%{opacity:1;transform:translateX(-50%) translateY(0) scaleY(1)}}
@keyframes flameIgnite{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(0)}60%{opacity:1;transform:translateX(-50%) translateY(-5px) scale(1.35)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes cakeMagicBurst{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.2)}18%{opacity:1}75%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1.25)}}
/* Display bach1.png through bach8.png inside the eight memory frames. */
.photo-empty img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 68%;border-radius:2px;transform:scale(1.24);transform-origin:50% 68%}
/* Move bach3.png and bach4.png upward to remove the dark top edge. */
.photo-frame:nth-child(3) .photo-empty img,.photo-frame:nth-child(4) .photo-empty img{transform:scale(1.24) translateY(-12%)}
/* Keep all eight frames balanced while preserving a small handmade tilt. */
.photo-frame:nth-child(1){--rot:-3deg}.photo-frame:nth-child(2){--rot:2deg}
.photo-frame:nth-child(3){--rot:3deg}.photo-frame:nth-child(4){--rot:-2deg}
.photo-frame:nth-child(5){--rot:3deg}.photo-frame:nth-child(6){--rot:-2deg}
.photo-frame:nth-child(7){--rot:-3deg}.photo-frame:nth-child(8){--rot:2deg}
</style>
</head>
<body>
<main id="site">
  <section class="opening">
    <div class="sky-glow"></div>
    <div class="tiny-stars" id="stars"></div>
    <div class="falling-glitter" id="openingGlitter" aria-hidden="true"></div>
    <div class="opening-copy"><h1>Lá thư cho<br><em>Hoàng Bách</em></h1></div>
    <button class="envelope-button" id="openLetter" aria-label="Mở thư sinh nhật">
      <span class="click-burst" id="letterBurst"></span>
      <span class="envelope-back"></span><span class="envelope-flap"></span>
      <span class="envelope-letter"><b>Happy Birthday</b><small>mở mình ra nhé ♡</small></span>
      <span class="envelope-front"></span><span class="seal">✦</span>
    </button>
    <p class="tap">CHẠM VÀO PHONG THƯ ĐỂ MỞ</p>
  </section>

  <section class="birthday">
    <div class="moon"></div><div class="sparkles" id="sparkles"></div>
    <div class="falling-glitter birthday-glitter" id="birthdayGlitter" aria-hidden="true"></div>
    <div class="photo-gallery" id="photoGallery" aria-label="Các khung ảnh kỷ niệm để trống"></div>
    <div class="birthday-card" id="birthdayCard">
      <h2>Chúc mừng<br><em>sinh nhật!</em></h2>
      <div class="cake-wrap" id="cake" role="button" tabindex="0" aria-label="Thổi nến sinh nhật">
        <span class="cake-magic" id="cakeMagic" aria-hidden="true"></span>
        <span class="flame" id="flame"></span><span class="candle"></span>
        <span class="cake-tier tier-top"><i></i><i></i><i></i></span>
        <span class="cake-tier tier-middle"><i></i><i></i><i></i><i></i></span>
        <span class="cake-tier tier-bottom"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="plate"></span>
      </div>
      <p class="wish">Chúc Bách một tuổi mới thật vui vẻ, hạnh phúc và gặp được nhiều may mắn trong cuộc sống. Luôn thuận lợi trong học tập và thành công trong công việc. Chúc Hoàng Bách tất cả, hẹ, hẹ, hẹ!</p>
      <button class="wish-button" id="blowCandle">Thổi nến</button>
    </div>
    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <button class="back" id="closeLetter">← Đóng thư</button>
  </section>
</main>
<script>
  const site = document.getElementById('site');
  const card = document.getElementById('birthdayCard');
  const cake = document.getElementById('cake');
  const flame = document.getElementById('flame');
  const gallery = document.getElementById('photoGallery');
  const celebration = document.getElementById('celebration');
  let opening = false;

  const addItems = (parent, count, build) => {
    for (let i = 0; i < count; i++) parent.appendChild(build(i));
  };
  const noise = seed => { const v = Math.sin(seed * 12.9898) * 43758.5453; return v - Math.floor(v); };

  addItems(document.getElementById('stars'), 28, i => {
    const e=document.createElement('i'); e.textContent='✦'; e.style.setProperty('--i',i); return e;
  });
  const makeGlitter = (i, second=false) => {
    const e=document.createElement('i');
    e.style.left=((i*(second?47:43)+(second?11:0))%100)+'%';
    e.style.width=(second?3+(i%4)*1.4:4+(i%4)*1.5)+'px';
    e.style.height=(second?8+(i%5)*2.5:10+(i%5)*3)+'px';
    e.style.animationDelay=-(i%(second?13:11))*(second?.65:.8)+'s';
    e.style.animationDuration=(second?4.2+(i%7)*.6:3.3+(i%7)*.55)+'s'; return e;
  };
  addItems(document.getElementById('openingGlitter'),54,i=>makeGlitter(i));
  addItems(document.getElementById('birthdayGlitter'),48,i=>makeGlitter(i,true));
  addItems(document.getElementById('sparkles'),36,i=>{const e=document.createElement('i');e.style.setProperty('--i',i);return e});
  addItems(document.getElementById('letterBurst'),110,i=>{
    const e=document.createElement('i');
    const x=Math.round((noise(i+1)+noise(i+17)+noise(i+53)-1.5)*440), y=Math.round(-220-noise(i+91)*410);
    e.style.setProperty('--i',i); e.style.setProperty('--burst-x',x+'px'); e.style.setProperty('--burst-y',y+'px');
    e.style.setProperty('--mid-x',Math.round(x*.3+(noise(i+121)-.5)*100)+'px'); e.style.setProperty('--mid-y',Math.round(y*.32)+'px');
    e.style.setProperty('--spin',(420+Math.round(noise(i+151)*900))+'deg'); e.style.width=(3+Math.round(noise(i+181)*4))+'px'; e.style.height=(6+Math.round(noise(i+211)*8))+'px'; return e;
  });
  addItems(gallery,8,i=>{const frame=document.createElement('div');frame.className='photo-frame photo-'+(i+1);frame.innerHTML='<div class="photo-empty"><img src="bach'+(i+1)+'.png" alt="Ảnh kỷ niệm '+(i+1)+'"></div>';return frame});
  addItems(document.getElementById('cakeMagic'),26,i=>{const e=document.createElement('i');e.style.setProperty('--p',i);return e});

  function blowCandles(){
    cake.classList.add('out'); flame.classList.add('off'); gallery.classList.add('photos-visible');
    celebration.innerHTML=''; addItems(celebration,45,i=>{const e=document.createElement('i');e.style.setProperty('--i',i);return e});
  }
  document.getElementById('openLetter').addEventListener('click',()=>{
    if(opening)return; opening=true; site.classList.add('opening-letter');
    setTimeout(()=>{site.classList.add('opened');setTimeout(()=>card.classList.add('visible'),1200)},900);
  });
  document.getElementById('blowCandle').addEventListener('click',blowCandles);
  cake.addEventListener('click',blowCandles);
  cake.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blowCandles()}});
  document.getElementById('closeLetter').addEventListener('click',()=>{
    site.className=''; card.classList.remove('visible'); cake.classList.remove('out'); flame.classList.remove('off');
    gallery.classList.remove('photos-visible'); celebration.innerHTML=''; opening=false;
  });
</script>
</body>
</html>
